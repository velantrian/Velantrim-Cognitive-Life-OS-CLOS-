# E3 · journal record vs ordinary summary — manual, fail-closed gate.
#
# Prereg: docs/E3_JOURNAL_RECORD_SUFFICIENCY_PREREG_2026_11_24.md
# Status of E3: RESEARCH ONLY · NO EXECUTION AUTHORIZATION.
# This workflow does NOT authorize a run. It only provides a place where an
# authorized run can happen once the operator has approved budget and the
# frozen fixtures + runner exist. Until then the `pilot` mode refuses.
#
# Modes:
#   preflight — no API calls, no cost. Checks secret presence (never prints it),
#               prereg file, fixtures and runner presence.
#   smoke     — ONE minimal DeepSeek call to verify key + endpoint. Paid (tiny).
#   pilot     — runs experiments/e3/runner.py against frozen fixtures. Paid.
#               Refuses unless fixtures, runner and authorization record exist.
#
# Secret: repository secret DEEPSEEK_API_KEY (Settings → Secrets and variables → Actions).
# Calls go only to https://api.deepseek.com (no OpenRouter).

name: E3 pilot (manual, gated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (free) | smoke (1 paid call) | pilot (paid run)"
        type: choice
        options: [preflight, smoke, pilot]
        default: preflight
      model:
        description: "DeepSeek model id"
        type: string
        default: deepseek-flash
      confirm:
        description: "For smoke/pilot type exactly: I AUTHORIZE PAID E3 CALLS"
        type: string
        default: ""
      repeats:
        description: "Repeats per combination (prereg: 2 → 192 successor answers)"
        type: string
        default: "2"

permissions:
  contents: read

concurrency:
  group: e3-pilot
  cancel-in-progress: false

jobs:
  e3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      E3_PREREG: docs/E3_JOURNAL_RECORD_SUFFICIENCY_PREREG_2026_11_24.md
      E3_DIR: experiments/e3
      E3_FIXTURES: experiments/e3/fixtures
      E3_RUNNER: experiments/e3/runner.py
      E3_AUTHORIZATION: experiments/e3/AUTHORIZATION.md
      MODE: ${{ inputs.mode }}
      MODEL: ${{ inputs.model }}
      CONFIRM: ${{ inputs.confirm }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (no API calls)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          fail=0
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "secret DEEPSEEK_API_KEY: present (length ${#DEEPSEEK_API_KEY})"
          else
            echo "::error::secret DEEPSEEK_API_KEY is not set for this repository"; fail=1
          fi
          [ -f "$E3_PREREG" ] && echo "prereg: $E3_PREREG" || { echo "::error::prereg missing: $E3_PREREG"; fail=1; }
          for p in "$E3_FIXTURES" "$E3_RUNNER" "$E3_AUTHORIZATION"; do
            [ -e "$p" ] && echo "present: $p" || echo "missing: $p (required for pilot)"
          done
          case "$REPEATS" in ''|*[!0-9]*) echo "::error::repeats must be a positive integer"; fail=1;; esac
          {
            echo "## E3 preflight"
            echo "- mode: \`$MODE\`, model: \`$MODEL\`, repeats: \`$REPEATS\`"
            echo "- expected successor answers: 4 families × 2 stories × 4 record variants × 3 continuations × $REPEATS"
            echo "- prereg status: RESEARCH ONLY · NO EXECUTION AUTHORIZATION"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Gate paid modes
        if: inputs.mode != 'preflight'
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "I AUTHORIZE PAID E3 CALLS" ]; then
            echo "::error::paid mode '$MODE' requires confirm = 'I AUTHORIZE PAID E3 CALLS'"; exit 1
          fi
          if [ "$MODE" = "pilot" ]; then
            missing=0
            for p in "$E3_FIXTURES" "$E3_RUNNER" "$E3_AUTHORIZATION"; do
              [ -e "$p" ] || { echo "::error::pilot refused: missing $p"; missing=1; }
            done
            [ $missing -eq 0 ] || {
              echo "Pilot needs frozen fixtures, a runner and an operator authorization record"
              echo "(budget + explicit permission, per prereg §'Черновик'). Nothing was called."
              exit 1; }
          fi

      - name: Smoke call (1 request)
        if: inputs.mode == 'smoke'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg m "$MODEL" '{model:$m, max_tokens:16, stream:false,
                 messages:[{role:"user", content:"Reply with the single word: ok"}]}')
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 120 \
                 https://api.deepseek.com/chat/completions \
                 -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
                 -H "Content-Type: application/json" -d "$body")
          echo "HTTP $code"
          jq '{model, finish: .choices[0].finish_reason, usage, error}' resp.json || true
          rm -f resp.json
          [ "$code" = "200" ]

      - uses: actions/setup-python@v5
        if: inputs.mode == 'pilot'
        with:
          python-version: "3.12"

      - name: Run E3 pilot
        if: inputs.mode == 'pilot'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          out="results/e3/${GITHUB_RUN_ID}"
          mkdir -p "$out"
          python -I "$E3_RUNNER" \
            --fixtures "$E3_FIXTURES" \
            --model "$MODEL" \
            --repeats "$REPEATS" \
            --out "$out"

      - name: Secret leak check on results
        if: inputs.mode == 'pilot' && always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          [ -d results ] || exit 0
          if grep -rqF -- "$DEEPSEEK_API_KEY" results; then
            echo "::error::API key found in results — artifacts will not be uploaded"
            rm -rf results; exit 1
          fi
          echo "no key material in results"

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'pilot' && always()
        with:
          name: e3-results-${{ github.run_id }}
          path: results/e3/
          if-no-files-found: ignore
          retention-days: 90
